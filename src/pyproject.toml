# IPM 多代理 Workshop 的 Python 專案定義。
#
# 版本政策：
#   每個相依都釘死精確版本，不使用版本範圍，也不追 main 分支。
#   前九個版本取自 2026-07-27 的 PyPI 實查與執行期反射，非記憶推測；
#   兩個 agentserver 套件沿用同一份 uv.lock 的解析結果。
#   升級任一 agent-framework 套件後，需重跑 Lab 2 → Lab 3 → Lab 4 全鏈路。
[project]
name = "ipm-multiagent-workshop"
version = "0.1.0"
description = "IPM 專案交付包健檢：Microsoft Agent Framework 多代理 workshop"
readme = "../README.md"
requires-python = ">=3.13"

dependencies = [
    # ── 穩定版 ────────────────────────────────────────────────
    "agent-framework-core==1.12.1",           # MAF 核心：Agent、Workflow
    "agent-framework-foundry==1.10.3",        # Foundry 整合：FoundryChatClient
    "agent-framework-orchestrations==1.0.1",  # Handoff orchestration
    "azure-ai-projects==2.3.0",               # 持久化 agent CRUD
    "azure-identity==1.25.3",                 # AzureCliCredential / managed identity
    "pydantic==2.13.4",                       # 結構化輸出資料契約
    "python-dotenv==1.2.2",                   # load_dotenv()

    # ── prerelease：教學鏈路第二、三站目前只有 prerelease 實作 ──
    # 兩者的成熟度需誠實揭露於 README 的「版本」一節。
    "agent-framework-devui==1.0.0b260721",           # Lab 2 本機 DevUI
    "agent-framework-foundry-hosting==1.0.0b260722", # Lab 3 Responses 主機

    # ── prerelease：`src/workflows/responses.py` 與 `src/main.py` 直接 import ──
    # 原本只是 foundry-hosting 的間接相依；直接使用就必須自己釘版本，
    # 否則 foundry-hosting 一升版，這兩個 API 可能悄悄改變。版本與 uv.lock 既有解析一致。
    "azure-ai-agentserver-core==2.0.0b8",            # AgentConfig（判斷是否託管）
    "azure-ai-agentserver-responses==1.0.0b9",       # HandoffResponsesHost 的基底
]

# 本專案不需被安裝成套件，只需可執行。
[tool.uv]
package = false

[dependency-groups]
# 單元測試覆蓋資料契約、角色註冊表、題組、preflight 與 Responses/Handoff 續接；
# agent 路由行為一律以 12 題題組重跑驗證，不模擬模型。
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",  # Responses 主機的 ASGI 端對端測試
]

[tool.pytest.ini_options]
# 測試放在 repository 根目錄的 tests/。
# 執行方式：cd src && uv run pytest
testpaths = ["../tests/unit"]
pythonpath = ["."]

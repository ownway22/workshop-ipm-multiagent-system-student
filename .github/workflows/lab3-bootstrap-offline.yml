name: Lab 3 bootstrap offline

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lab3-bootstrap-offline.yml"
      - "deploy/scripts/**"
      - "deploy/infra/**"
      - "solutions/lab3/deploy/scripts/**"
      - "solutions/lab3/deploy/infra/**"
      - "src/preflight/**"
      - "tests/unit/test_lab3_bootstrap.py"

permissions:
  contents: read

concurrency:
  group: lab3-bootstrap-offline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install only offline test dependencies
        run: python -m pip install pytest==9.1.1 python-dotenv==1.2.2
      - name: Test mocked az and azd on Windows PowerShell 5.1 and pwsh
        run: |
          Get-Command powershell, pwsh -ErrorAction Stop | Out-Null
          python -m pytest -c src\pyproject.toml tests\unit\test_lab3_bootstrap.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Bicep only (public module restore, no Azure login or deployment)
        run: |
          az bicep build --file deploy\infra\main.bicep --outfile "$env:RUNNER_TEMP\lab3-main.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          az bicep build --file solutions\lab3\deploy\infra\main.bicep --outfile "$env:RUNNER_TEMP\lab3-solution.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
